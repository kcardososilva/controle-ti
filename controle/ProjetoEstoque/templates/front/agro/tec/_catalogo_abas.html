{% comment %}As seis listas do catálogo, como segmentos. Recebe `abas_do_catalogo` e `cat` (o ativo).{% endcomment %}
<nav class="m2m-segmentos m2m-segmentos--grande" aria-label="Cadastros do catálogo">
  {% for a in abas_do_catalogo %}<a href="{{ a.url }}" {% if a.chave == cat.chave %}class="is-ativa" aria-current="page"{% endif %}><span>{{ a.rotulo }}</span></a>{% endfor %}
</nav>
