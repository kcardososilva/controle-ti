<script>
/* ============================================================
   Quiosque — módulo compartilhado dos MAPAS (frota + detalhe).
   Incluir SEMPRE depois do <script> do Leaflet e junto de
   _kq_mapa_css.html (as classes dos divIcon vivem lá).

   Por que as camadas de fundo ficam aqui e não em cada tela: as duas
   telas precisam exatamente do mesmo conjunto, e foi justamente uma
   divergência silenciosa entre elas que deixou o problema do
   OpenStreetMap passar despercebido (ver KQMapa.CAMADAS).
   ============================================================ */
window.KQMapa = (function () {
  "use strict";

  var ATTR_ESRI = 'Tiles &copy; Esri';
  var ATTR_OSM = '&copy; <a href="https://www.openstreetmap.org/copyright">colaboradores do OpenStreetMap</a>';

  /* ── Camadas de fundo ──────────────────────────────────────────────────
     DADOS do OpenStreetMap sim; SERVIDOR do openstreetmap.org não. A
     distinção é o ponto todo desta lista, e confundir as duas coisas já
     custou duas camadas inúteis aqui.

     `tile.openstreetmap.org` responde "403 Access blocked" ao IP desta
     empresa (política de uso dos servidores voluntários). O veneno está na
     forma da resposta: é um PNG válido, status 200, servido para QUALQUER
     coordenada e zoom. O navegador desenha a imagem de aviso como se fosse
     um tile normal, o Leaflet não dispara `tileerror`, e a camada vira um
     mosaico repetido sem um único erro no console. Trocar subdomínio ou
     User-Agent não resolve — o bloqueio é por política, não por endereço.

     O CARTO (`basemaps.cartocdn.com`) caiu no MESMO buraco depois: passou a
     exigir API key e hoje devolve um tile escrito "API KEY REQUIRED", de
     novo com status 200 e de novo em silêncio. Por isso existe agora o
     `_sondarPlaceholder` abaixo: a defesa não podia continuar sendo "lembrar
     de não usar o provedor X", porque o provedor bom de ontem vira o
     provedor quebrado de amanhã sem avisar ninguém.

     A camada "Mapa (OpenStreetMap)" serve os mesmos dados do OSM — os pivôs
     com nome, os canais, os galpões, que é o que o satélite não rotula — por
     um operador que permite este uso. As demais vêm do ArcGIS/Esri, mesmo
     host do satélite, comprovadamente liberado no firewall da empresa.

     maxNativeZoom evita o placeholder "Map data not yet available" onde o
     provedor não tem imagem no zoom pedido — o Leaflet passa a reescalar o
     último tile disponível. */
  var CAMADAS = [
    { id: "satelite", rotulo: "Satélite",
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      opts: { maxZoom: 19, maxNativeZoom: 17, attribution: ATTR_ESRI } },
    { id: "hibrido", rotulo: "Satélite + nomes",
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      opts: { maxZoom: 19, maxNativeZoom: 17, attribution: ATTR_ESRI },
      // Sobreposição de rótulos (estradas/localidades) por cima da imagem:
      // numa fazenda é o que dá referência sem perder o terreno real.
      overlay: "https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}" },
    { id: "ruas", rotulo: "Ruas",
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}",
      opts: { maxZoom: 19, maxNativeZoom: 18, attribution: ATTR_ESRI } },
    { id: "topo", rotulo: "Topográfico",
      url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}",
      opts: { maxZoom: 19, maxNativeZoom: 18, attribution: ATTR_ESRI } },
    { id: "osm", rotulo: "Mapa (OpenStreetMap)",
      url: "https://tile.openstreetmap.de/{z}/{x}/{y}.png",
      opts: { maxZoom: 19, maxNativeZoom: 18, attribution: ATTR_OSM + ' &middot; tiles: openstreetmap.de' } }
  ];

  var CHAVE_CAMADA = "kq_mapa_camada";

  function _ler(chave, padrao) {
    try { var v = localStorage.getItem(chave); return v === null ? padrao : v; }
    catch (e) { return padrao; }
  }
  function _gravar(chave, valor) {
    try { localStorage.setItem(chave, valor); } catch (e) { /* modo privado */ }
  }

  /* Monta as camadas de fundo, o seletor e a persistência da escolha.
     Devolve { control } — as camadas em si ficam sob controle do Leaflet. */
  function montarCamadas(map, opcoes) {
    opcoes = opcoes || {};
    var mapaDeCamadas = {};
    var porId = {};
    var overlays = {};

    /* `opcoes.crossOrigin` existe para a tela que exporta o mapa desenhando os
       tiles num <canvas> (Mapa de Sinal). Sem o atributo crossorigin na <img>,
       o canvas fica "tainted" e `toBlob()` lança SecurityError — a imagem
       aparece na tela e o download simplesmente falha.

       É opt-in, e não o padrão, de propósito: com crossorigin ligado um tile
       servido SEM cabeçalho CORS não é apenas rejeitado no canvas, ele não
       carrega de jeito nenhum. Ligar para toda a frota arriscaria apagar o
       fundo do mapa nas duas telas que não precisam disso. */
    function _opts(base) {
      if (!opcoes.crossOrigin) return base;
      var o = {};
      for (var k in base) if (Object.prototype.hasOwnProperty.call(base, k)) o[k] = base[k];
      o.crossOrigin = true;
      return o;
    }

    CAMADAS.forEach(function (def) {
      var camada = L.tileLayer(def.url, _opts(def.opts));
      if (def.overlay) {
        // Base + rótulos viajam como UMA opção no seletor: o usuário escolhe
        // "Satélite + nomes", não monta a combinação na mão.
        var rot = L.tileLayer(def.overlay, _opts({ maxZoom: 19, maxNativeZoom: 17, attribution: ATTR_ESRI }));
        camada = L.layerGroup([camada, rot]);
      }
      // Último zoom com imagem REAL desta camada. Acima dele o Leaflet reamplia
      // o tile anterior: a tela continua respondendo ao zoom, mas nenhum detalhe
      // novo aparece — é o que fazia a borda do pivô "sumir" justamente quando
      // se aproximava para vê-la. Guardado aqui para o aviso de nitidez e para o
      // modo terreno saberem onde está esse limite, sem repetir o número.
      camada._kqNativo = def.opts.maxNativeZoom || def.opts.maxZoom || 19;
      // Guardados para a sonda de placeholder (_sondarPlaceholder) poder
      // montar URLs de tile desta camada sem depender do Leaflet.
      camada._kqUrl = def.url;
      camada._kqRotulo = def.rotulo;
      camada._kqSub = (def.opts.subdomains || "a")[0];
      mapaDeCamadas[def.rotulo] = camada;
      porId[def.id] = camada;
      camada._kqId = def.id;
      overlays[def.id] = camada;
    });

    var escolhida = _ler(CHAVE_CAMADA, opcoes.padrao || "satelite");
    var inicial = porId[escolhida] || porId.satelite;
    inicial.addTo(map);

    var control = L.control.layers(mapaDeCamadas, null, { position: "topright" }).addTo(map);
    var estado = { aviso: null };

    map.on("baselayerchange", function (ev) {
      // Trocar de camada zera o diagnóstico: o aviso falava da camada ANTERIOR,
      // e deixá-lo na tela culparia a camada nova pelo problema da velha.
      if (estado.aviso) { map.removeControl(estado.aviso); estado.aviso = null; }
      if (!ev.layer) return;
      if (ev.layer._kqId) _gravar(CHAVE_CAMADA, ev.layer._kqId);
      _sondarPlaceholder(map, ev.layer, estado);
    });

    _vigiarTiles(map, estado);
    map.whenReady(function () { _sondarPlaceholder(map, inicial, estado); });
    return { control: control, camadas: porId };
  }

  /* Aviso único sobre o mapa, no canto inferior esquerdo. Só um por vez: duas
     tarjas empilhadas cobririam justamente o mapa que se quer mostrar. */
  function _aviso(map, estado, html) {
    if (estado.aviso) return;
    estado.aviso = L.control({ position: "bottomleft" });
    estado.aviso.onAdd = function () {
      var d = L.DomUtil.create("div", "kq-mapaviso");
      d.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i>' + html;
      L.DomEvent.disableClickPropagation(d);
      return d;
    };
    estado.aviso.addTo(map);
  }

  var TROCAR = ' Escolha outra no seletor de camadas (canto superior direito).';

  /* Falha REAL de tiles: provedor fora do ar, firewall bloqueando o host.
     O Leaflet emite `tileerror` e o aviso aparece em vez da tela cinza muda. */
  function _vigiarTiles(map, estado) {
    var erros = 0;
    map.on("tileerror", function () {
      if (++erros < 6) return;
      _aviso(map, estado, "Esta camada de fundo não está carregando." + TROCAR);
    });
    // Sem zerar aqui, os erros da camada anterior se somariam aos da nova e
    // acusariam de falha uma camada que está carregando bem.
    map.on("baselayerchange", function () { erros = 0; });
  }

  /* ── Sonda de provedor "mudo" ──────────────────────────────────────────
     A falha que o `tileerror` NÃO pega: o servidor responde 200 com um PNG
     perfeitamente válido, só que é sempre a MESMA figura, em qualquer
     coordenada e zoom — o "403 Access blocked" do openstreetmap.org, o
     "API KEY REQUIRED" que o CARTO passou a devolver. O navegador desenha,
     o Leaflet não reclama, e a pessoa fica olhando um mosaico repetido sem
     nenhum erro no console. Foi assim nas duas vezes.

     A checagem precisa ser explícita, então: baixa dois tiles de propósito
     MUITO diferentes — um do mundo inteiro (z=2) e outro do pedaço que está
     na tela — e compara os bytes. Dois tiles tão distantes só saem idênticos
     quando o servidor devolve sempre a mesma imagem. Comparar tiles VIZINHOS
     não serviria: em área vazia eles são legitimamente iguais e o alarme
     seria falso — foi o que quase me enganou ao diagnosticar isto.

     Roda uma vez por camada, só quando a camada entra em uso. Se o fetch
     falhar (CORS, rede, offline) não acusa nada: falha dura já tem dono. */
  var _sondadas = {};

  function _urlTile(camada, z, x, y) {
    return String(camada._kqUrl)
      .replace("{s}", camada._kqSub || "a").replace("{r}", "")
      .replace("{z}", z).replace("{x}", x).replace("{y}", y);
  }

  function _mesmosBytes(a, b) {
    if (a.byteLength !== b.byteLength) return false;
    var va = new Uint8Array(a), vb = new Uint8Array(b);
    for (var i = 0; i < va.length; i++) if (va[i] !== vb[i]) return false;
    return true;
  }

  function _sondarPlaceholder(map, camada, estado) {
    if (!camada || !camada._kqUrl || !window.fetch || _sondadas[camada._kqId]) return;
    _sondadas[camada._kqId] = true;

    // Piso de zoom 6 garante que a sonda local nunca caia no mesmo tile da
    // sonda global (z=2) — senão a comparação acusaria a si mesma.
    var c = map.getCenter();
    var z = Math.min(Math.max(map.getZoom(), 6), camada._kqNativo || 18);
    var n = Math.pow(2, z);
    var rad = c.lat * Math.PI / 180;
    var x = Math.floor((c.lng + 180) / 360 * n);
    var y = Math.floor((1 - Math.log(Math.tan(rad) + 1 / Math.cos(rad)) / Math.PI) / 2 * n);

    /* `cache: "reload"` não é zelo exagerado, é obrigatório: nas telas que NÃO
       pedem crossOrigin os tiles entram no cache como resposta no-cors, sem
       cabeçalho CORS. Um `fetch` normal reaproveita essa entrada e o navegador
       o rejeita com erro de CORS no console — a sonda ficava barulhenta e cega
       exatamente nas telas onde ninguém mais está olhando o problema. */
    Promise.all([_urlTile(camada, 2, 1, 2), _urlTile(camada, z, x, y)].map(function (u) {
      return fetch(u, { mode: "cors", cache: "reload" })
        .then(function (r) { return r.ok ? r.arrayBuffer() : null; });
    })).then(function (b) {
      if (!b[0] || !b[1] || !_mesmosBytes(b[0], b[1])) return;
      _aviso(map, estado, "O provedor da camada <b>" + _escapar(camada._kqRotulo || "selecionada") +
             "</b> está devolvendo a mesma imagem para todo lugar (bloqueio de uso ou chave exigida), " +
             "então o fundo do mapa não vale nada aqui." + TROCAR);
    }).catch(function () { /* rede/CORS: `tileerror` cobre */ });
  }

  /* ── Selo de conexão/sinal ───────────────────────────────────────────── */

  function _escapar(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }

  /* HTML do selo. `sinal` = {rotulo, nivel, dbm, operadora, tipo} vindo do
     servidor (sinal_do_checkin/sinal_atual_device). nivel null = o aparelho
     NÃO reporta força de sinal: mostra só o transporte, sem barras — nunca
     um nível inventado. */
  function seloHtml(sinal, online) {
    if (!sinal) return "";
    var nivel = (sinal.nivel === null || sinal.nivel === undefined) ? null : Math.max(0, Math.min(4, sinal.nivel));
    var classe = !online ? "off" : (nivel === null ? "sem" : "n" + nivel);
    var texto = online ? (sinal.rotulo || "Rede") : "Sem conexão";
    var barras = "";
    if (online && nivel !== null) {
      barras = '<span class="kq-selo-bars">';
      for (var i = 1; i <= 4; i++) barras += '<i class="' + (i <= nivel ? "on" : "") + '"></i>';
      barras += "</span>";
    }
    return '<span class="kq-selo ' + classe + '"><span class="kq-selo-txt">' +
           _escapar(texto) + "</span>" + barras + "</span>";
  }

  function iconeSelo(sinal, online) {
    return L.divIcon({
      className: "kq-selo-wrap",
      html: seloHtml(sinal, online),
      iconSize: null,          // deixa o conteúdo definir a largura do pill
      iconAnchor: [0, 26]      // ajustado no runtime por _centralizarSelo
    });
  }

  /* O divIcon nasce ancorado pela esquerda; centralizar exige a largura real,
     que só existe depois de estar no DOM. Roda uma vez por marcador. */
  function centralizarSelo(marcador) {
    var el = marcador.getElement && marcador.getElement();
    if (!el) return;
    var largura = el.offsetWidth || 0;
    if (largura) el.style.marginLeft = (-largura / 2) + "px";
  }

  /* ── Colisão entre selos ──────────────────────────────────────────────
     Num mapa real os selos se amontoam: no da frota, dezenas de aparelhos
     fixos ficam no mesmo pátio; no da rota, a conexão cai e volta num trecho
     de 200 m. Sem filtro, viram um borrão ilegível.

     O teste é por SOBREPOSIÇÃO DE RETÂNGULO, não por distância entre centros:
     os rótulos têm larguras bem diferentes ("4G" ≈ 46 px, "Sem conexão" ≈ 100
     px) e dois selos largos se sobrepõem mesmo com os centros afastados.
     É medida de TELA, então precisa ser refeita a cada mudança de zoom.

     Nada de informação se perde: o marcador embaixo continua clicável, e dar
     zoom separa os selos e revela os que tinham sido omitidos. */
  var SELO_ALTURA_PX = 18;
  var SELO_FOLGA_PX = 5;
  var SELO_OFFSET_Y = 28;   // o selo é desenhado ACIMA do ponto

  /* Largura estimada do pill antes de existir no DOM: ~6.1 px por caractere
     (Segoe UI 10.5px, peso 700) + padding + as 4 barrinhas quando há nível. */
  function larguraSelo(sinal, online) {
    var texto = online ? ((sinal && sinal.rotulo) || "Rede") : "Sem conexão";
    var temNivel = online && sinal && sinal.nivel !== null && sinal.nivel !== undefined;
    return 16 + texto.length * 6.1 + (temNivel ? 18 : 0);
  }

  /* itens: [{lat, lon, sinal, online}] (campos extras são preservados).
     Devolve o subconjunto que cabe sem sobreposição. Os itens SEM conexão são
     posicionados primeiro — são a informação que o mapa existe para dar, então
     reservam espaço e os demais é que cedem. */
  function semColisao(map, itens) {
    if (!map._loaded) return [];
    var ocupados = [], saida = [];

    function tentar(it) {
      var centro = map.latLngToContainerPoint([it.lat, it.lon]);
      var meia = larguraSelo(it.sinal, it.online) / 2 + SELO_FOLGA_PX;
      var caixa = {
        e: centro.x - meia, d: centro.x + meia,
        c: centro.y - SELO_OFFSET_Y,
        b: centro.y - SELO_OFFSET_Y + SELO_ALTURA_PX + SELO_FOLGA_PX
      };
      for (var i = 0; i < ocupados.length; i++) {
        var o = ocupados[i];
        if (caixa.e < o.d && caixa.d > o.e && caixa.c < o.b && caixa.b > o.c) return;
      }
      ocupados.push(caixa);
      saida.push(it);
    }

    itens.forEach(function (it) { if (!it.online) tentar(it); });
    itens.forEach(function (it) { if (it.online) tentar(it); });
    return saida;
  }

  function textoSinal(sinal, online) {
    if (!online) return "Sem conexão";
    if (!sinal) return "—";
    var partes = [sinal.rotulo || "Rede"];
    if (sinal.nivel !== null && sinal.nivel !== undefined) partes.push("sinal " + sinal.nivel + "/4");
    if (sinal.dbm !== null && sinal.dbm !== undefined) partes.push(sinal.dbm + " dBm");
    if (sinal.operadora) partes.push(sinal.operadora);
    return partes.join(" · ");
  }

  /* ── Painel de filtros (controle Leaflet, canto inferior esquerdo) ───── */

  /* itens: [{id, rotulo, padrao}] · aoMudar(estado) roda a cada alteração e
     uma vez na montagem. O estado é persistido por `chave` (localStorage),
     para o filtro sobreviver ao F5 como o resto da tela. */
  function painelFiltros(map, opcoes) {
    var itens = opcoes.itens || [];
    var chave = opcoes.chave || "kq_mapa_filtros";
    var estado = {};
    var salvo = {};
    try { salvo = JSON.parse(_ler(chave, "{}")) || {}; } catch (e) { salvo = {}; }
    itens.forEach(function (it) {
      estado[it.id] = (typeof salvo[it.id] === "boolean") ? salvo[it.id] : !!it.padrao;
    });

    var ctl = L.control({ position: opcoes.posicao || "bottomleft" });
    ctl.onAdd = function () {
      var box = L.DomUtil.create("div", "kq-mapctl");
      var aberto = _ler(chave + "_aberto", "1") === "1";
      if (!aberto) L.DomUtil.addClass(box, "is-closed");

      var html = '<button type="button" class="kq-mapctl-head">' +
                 '<span><i class="fa-solid fa-sliders"></i> ' + _escapar(opcoes.titulo || "Exibir no mapa") + "</span>" +
                 '<i class="fa-solid fa-chevron-down chev"></i></button><div class="kq-mapctl-body">';
      itens.forEach(function (it) {
        html += '<label><input type="checkbox" data-kq="' + _escapar(it.id) + '"' +
                (estado[it.id] ? " checked" : "") + "> " + _escapar(it.rotulo) + "</label>";
      });
      if (opcoes.legenda) html += '<div class="kq-mapctl-sep"></div>' + opcoes.legenda;
      html += "</div>";
      box.innerHTML = html;

      // Sem isso, arrastar/rolar sobre o painel movimenta o mapa por baixo.
      L.DomEvent.disableClickPropagation(box);
      L.DomEvent.disableScrollPropagation(box);

      var cabecalho = box.querySelector(".kq-mapctl-head");
      cabecalho.addEventListener("click", function () {
        var fechado = L.DomUtil.hasClass(box, "is-closed");
        if (fechado) L.DomUtil.removeClass(box, "is-closed"); else L.DomUtil.addClass(box, "is-closed");
        _gravar(chave + "_aberto", fechado ? "1" : "0");
      });

      box.querySelectorAll("input[data-kq]").forEach(function (inp) {
        inp.addEventListener("change", function () {
          estado[inp.getAttribute("data-kq")] = inp.checked;
          _gravar(chave, JSON.stringify(estado));
          opcoes.aoMudar(estado);
        });
      });
      return box;
    };
    ctl.addTo(map);
    opcoes.aoMudar(estado);
    return { estado: estado };
  }

  /* ── Modo terreno (ver os pivôs e as divisas) ─────────────────────────
     Numa fazenda, o fundo NÃO é decoração: os pivôs, as bordas das lavouras e
     as estradas estão na imagem de satélite, e é sobre eles que se lê onde o
     aparelho passou. O que escondia esse terreno eram duas coisas:

       1. A própria sobreposição — traço grosso, pontos, círculos de precisão e
          selos cobrindo o chão. Aqui ela é atenuada, não removida: a rota
          continua visível como referência, só deixa de disputar a atenção.
       2. O zoom acima do último nível com imagem real, onde o Leaflet só
          amplia o tile anterior. Aproximar passava a BORRAR em vez de
          detalhar. No modo terreno o zoom é travado nesse limite.

     O leve ganho de contraste/saturação é o que destaca a divisa entre o
     círculo irrigado e o solo seco em volta. */
  var CHAVE_TERRENO = "kq_mapa_terreno";

  function zoomNativo(map) {
    var limite = null;
    map.eachLayer(function (camada) {
      if (camada._kqNativo) limite = Math.min(limite === null ? 99 : limite, camada._kqNativo);
    });
    return limite;
  }

  /* Aviso de que a imagem passou da resolução do provedor. Sem ele, a pessoa
     continua aproximando achando que vai melhorar — e a imagem só piora. */
  function avisoNitidez(map) {
    var ctl = L.control({ position: "bottomright" });
    var elemento = null;
    ctl.onAdd = function () {
      elemento = L.DomUtil.create("div", "kq-nitidez");
      elemento.innerHTML = '<i class="fa-solid fa-circle-info"></i> ' +
        'Imagem ampliada além da resolução do satélite — afaste um nível para ver o terreno nítido.';
      L.DomEvent.disableClickPropagation(elemento);
      return elemento;
    };
    ctl.addTo(map);

    function atualizar() {
      var limite = zoomNativo(map);
      if (!elemento) return;
      var passou = limite !== null && map.getZoom() > limite;
      elemento.style.display = passou ? "" : "none";
    }
    map.on("zoomend baselayerchange", atualizar);
    atualizar();
  }

  function modoTerreno(map, opcoes) {
    opcoes = opcoes || {};
    var ativo = _ler(CHAVE_TERRENO, "0") === "1";
    var recipiente = map.getContainer();
    var zoomMaximoOriginal = map.getMaxZoom();

    function aplicar() {
      if (ativo) L.DomUtil.addClass(recipiente, "kq-terreno");
      else L.DomUtil.removeClass(recipiente, "kq-terreno");

      var limite = zoomNativo(map);
      if (ativo && limite !== null) {
        map.setMaxZoom(limite);
        if (map.getZoom() > limite) map.setZoom(limite);
      } else {
        map.setMaxZoom(zoomMaximoOriginal);
      }
      if (opcoes.aoMudar) opcoes.aoMudar(ativo);
    }

    var ctl = L.control({ position: opcoes.posicao || "topright" });
    ctl.onAdd = function () {
      var caixa = L.DomUtil.create("div", "kq-terreno-btn");
      caixa.innerHTML = '<button type="button" title="Destaca a imagem do terreno: ' +
        'atenua a rota e trava o zoom no limite da imagem de satélite">' +
        '<i class="fa-solid fa-mountain-sun"></i><span>Terreno</span></button>';
      var botao = caixa.querySelector("button");
      if (ativo) L.DomUtil.addClass(botao, "is-on");
      L.DomEvent.disableClickPropagation(caixa);
      botao.addEventListener("click", function () {
        ativo = !ativo;
        _gravar(CHAVE_TERRENO, ativo ? "1" : "0");
        if (ativo) L.DomUtil.addClass(botao, "is-on");
        else L.DomUtil.removeClass(botao, "is-on");
        aplicar();
      });
      return caixa;
    };
    ctl.addTo(map);

    // Trocar de camada muda o limite nativo (o satélite para no 17, o mapa
    // claro vai ao 20) — reaplica para o travamento acompanhar.
    map.on("baselayerchange", function () { setTimeout(aplicar, 0); });
    aplicar();
    return { ativo: function () { return ativo; } };
  }

  /* ── Utilidades de geometria ─────────────────────────────────────────── */

  /* Ângulo (graus, 0 = norte) de A para B — orienta as setas de sentido.
     Aproximação plana: nas distâncias de uma fazenda o erro é irrelevante
     e evita trigonometria esférica a cada segmento do traço. */
  function rumo(a, b) {
    var dy = b[0] - a[0];
    var dx = (b[1] - a[1]) * Math.cos((a[0] + b[0]) / 2 * Math.PI / 180);
    return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
  }

  function iconeSeta(graus, cor) {
    return L.divIcon({
      className: "kq-seta",
      html: '<span style="color:' + cor + ';transform:rotate(' + (graus + 180) + 'deg);"></span>',
      iconSize: [10, 10], iconAnchor: [5, 5]
    });
  }

  return {
    CAMADAS: CAMADAS,
    montarCamadas: montarCamadas,
    seloHtml: seloHtml,
    iconeSelo: iconeSelo,
    centralizarSelo: centralizarSelo,
    textoSinal: textoSinal,
    painelFiltros: painelFiltros,
    modoTerreno: modoTerreno,
    avisoNitidez: avisoNitidez,
    zoomNativo: zoomNativo,
    semColisao: semColisao,
    larguraSelo: larguraSelo,
    rumo: rumo,
    iconeSeta: iconeSeta,
    escapar: _escapar,
    COR_ON: "#34c759",
    COR_OFF: "#ff3b30",
    COR_PARADO: "#0078d4"
  };
})();
</script>
