<style>
/* ============================================================
   Quiosque — sistema de design compartilhado (single source of truth)
   Paleta grounded em Fluent 2 (Microsoft): mesma rampa de cinza neutra
   + accent azul oficial (#0078d4 / #479ef5 no escuro) já usada em
   Licenças, Toner e Preventivas nesta sessão. Reutilizado por TODAS
   as telas do módulo — nunca duplicar/editar tokens por arquivo.
   ============================================================ */

:where(.kq-page, .kq-det, .kq-mat, .kq-cfg, .kqi-page, .kq-mapa, .kq-modal) {
  --kq-gray-98: #fafafa; --kq-gray-96: #f5f5f5; --kq-gray-94: #f0f0f0;
  --kq-gray-92: #ebebeb; --kq-gray-90: #e6e6e6; --kq-gray-84: #d6d6d6;
  --kq-gray-38: #616161; --kq-gray-26: #424242; --kq-gray-14: #242424;

  --kq-accent: #0078d4;
  --kq-accent-hover: #106ebe;
  --kq-accent-soft: rgba(0, 120, 212, .08);
  --kq-accent-border: rgba(0, 120, 212, .24);

  --kq-page: var(--kq-gray-96);
  --kq-surface: #ffffff;
  --kq-surface-soft: var(--kq-gray-94);
  --kq-fill: var(--kq-gray-94);
  --kq-fill-2: var(--kq-gray-92);

  --kq-text: var(--kq-gray-14);
  --kq-muted: var(--kq-gray-26);
  --kq-soft: var(--kq-gray-38);

  --kq-border: var(--kq-gray-90);
  --kq-border-strong: var(--kq-gray-84);

  --kq-success: var(--success);
  --kq-success-bg: var(--success-soft);
  --kq-warning: var(--warning);
  --kq-warning-bg: var(--warning-soft);
  --kq-danger: var(--danger);
  --kq-danger-bg: var(--danger-soft);
  --kq-info: var(--info);
  --kq-info-bg: var(--info-soft);

  --kq-radius-sm: 6px;
  --kq-radius-md: 8px;
  --kq-radius-lg: 10px;
  --kq-radius-xl: 12px;

  --kq-shadow-sm: 0 1px 2px rgba(0,0,0,.06), 0 1px 1px rgba(0,0,0,.04);
  --kq-shadow-md: 0 4px 12px rgba(0,0,0,.08), 0 1px 3px rgba(0,0,0,.05);

  --kq-control-h: 38px;
  --kq-transition: 150ms ease;
  --kq-font: "Segoe UI", var(--font-display, -apple-system, sans-serif);
}

body.theme-dark :where(.kq-page, .kq-det, .kq-mat, .kq-cfg, .kqi-page, .kq-mapa, .kq-modal) {
  --kq-page: #14171d;
  --kq-surface: #1a1d24;
  --kq-surface-soft: #20242c;
  --kq-fill: #20242c;
  --kq-fill-2: #262a33;

  --kq-border: #2a2e38;
  --kq-border-strong: #363b47;

  --kq-text: #f1f2f5;
  --kq-muted: #b7bcc6;
  --kq-soft: #8992a0;

  --kq-accent: #479ef5;
  --kq-accent-hover: #62abf5;
  --kq-accent-soft: rgba(71, 158, 245, .16);
  --kq-accent-border: rgba(71, 158, 245, .34);
}

/* ── Reset + fundo da página (canvas cinza ↔ cartões brancos) ────────── */
.kq-page, .kq-det, .kq-mat, .kq-cfg, .kqi-page, .kq-mapa,
.kq-page *, .kq-det *, .kq-mat *, .kq-cfg *, .kqi-page *, .kq-mapa * {
  box-sizing: border-box; min-width: 0;
}
.kq-page, .kq-det, .kq-mat, .kq-cfg, .kqi-page, .kq-mapa {
  font-family: var(--kq-font);
  color: var(--kq-text);
  background: var(--kq-page);
  border-radius: 12px;
  padding: 4px;
}

/* ── Nota contextual discreta ─────────────────────────────────────────── */
.kq-note {
  display: flex; align-items: center; gap: 10px; padding: 10px 14px;
  border: 1px solid var(--kq-border); border-radius: var(--kq-radius-md);
  background: var(--kq-surface-soft); color: var(--kq-soft); font-size: 12.5px; line-height: 1.45;
}
.kq-note i { color: var(--kq-soft); font-size: 13px; flex: 0 0 auto; }
.kq-note a { color: var(--kq-accent); font-weight: 600; }
.kq-note.is-warn { background: var(--kq-warning-bg); color: var(--kq-warning); }
.kq-note.is-warn i { color: var(--kq-warning); }

.kq-actcount {
  display: inline-grid; place-items: center; min-width: 18px; height: 18px; padding: 0 5px; margin-left: 2px;
  border-radius: 99px; background: rgba(255,255,255,.22); color: #fff; font-size: 11px; font-weight: 600; font-variant-numeric: tabular-nums;
}

/* ── Metric strip (células = filtros de status) ──────────────────────── */
.kq-metrics {
  display: grid; gap: 1px; background: var(--kq-border); border: 1px solid var(--kq-border);
  border-radius: var(--kq-radius-lg); overflow: hidden; box-shadow: var(--kq-shadow-sm);
}
.kq-metric {
  position: relative; display: block; padding: 13px 15px; background: var(--kq-surface);
  text-decoration: none; color: inherit; transition: background var(--kq-transition);
}
.kq-metric:hover { background: var(--kq-fill); }
.kq-metric.is-active { background: var(--kq-accent-soft); }
.kq-metric.is-active::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--kq-accent); }
.kq-metric-l { display: flex; align-items: center; gap: 6px; font-size: 10.5px; font-weight: 600; letter-spacing: .03em; text-transform: uppercase; color: var(--kq-soft); }
.kq-metric .l { display: flex; align-items: center; justify-content: center; gap: 5px; margin-top: 5px; font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .02em; color: var(--kq-soft); }
.kq-metric-l .mdot, .kq-metric .l .mdot { width: 7px; height: 7px; border-radius: 99px; }
.kq-metric-v, .kq-metric .v { margin-top: 7px; font-size: 21px; font-weight: 600; line-height: 1; color: var(--kq-text); font-variant-numeric: tabular-nums; }
.kq-metric .v { margin-top: 0; }

/* ── Toolbar de busca ─────────────────────────────────────────────────── */
.kq-toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kq-search {
  display: flex; align-items: center; gap: 9px; height: var(--kq-control-h); padding: 0 12px; flex: 1; min-width: 200px;
  border-radius: var(--kq-radius-sm); background: var(--kq-surface-soft); border: 1px solid var(--kq-border-strong);
  transition: border-color var(--kq-transition), box-shadow var(--kq-transition);
}
.kq-search:focus-within { background: var(--kq-surface); border-color: var(--kq-accent); box-shadow: 0 0 0 3px var(--kq-accent-soft); }
.kq-search i { color: var(--kq-soft); font-size: 13px; }
.kq-search input { flex: 1; min-width: 0; border: 0; background: none; outline: none; font-size: 13.5px; font-family: inherit; color: var(--kq-text); }
.kq-search input::placeholder { color: var(--kq-soft); }

/* ── Cartão + tabela ──────────────────────────────────────────────────── */
.kq-card { background: var(--kq-surface); border: 1px solid var(--kq-border); border-radius: var(--kq-radius-xl); box-shadow: var(--kq-shadow-sm); overflow: hidden; }
.kq-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--kq-border); background: var(--kq-surface-soft); }
.kq-card-head-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.kq-card-title { display: flex; align-items: center; gap: 8px; font-size: .9rem; font-weight: 700; color: var(--kq-text); }
.kq-card-title i { color: var(--kq-accent); font-size: 13px; }
.kq-card-sub { font-size: 12px; color: var(--kq-soft); font-weight: 500; }
.kq-card-sub b { color: var(--kq-accent); font-variant-numeric: tabular-nums; }
.kq-count { font-size: 12px; color: var(--kq-soft); font-weight: 500; }
.kq-card-body { padding: 14px 16px; display: grid; gap: 14px; }

/* ── Tabela (grade estilo planilha — Excel/Office) ───────────────────── */
.kq-scroll { width: 100%; overflow-x: auto; -webkit-overflow-scrolling: touch; }
.kq-table { width: 100%; border-collapse: collapse; border-top: 1px solid var(--kq-border); border-left: 1px solid var(--kq-border); }
.kq-table thead th {
  position: sticky; top: 0; z-index: 1; background: var(--kq-surface-soft); padding: 9px 14px; text-align: left;
  font-size: .68rem; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; color: var(--kq-soft);
  border-bottom: 1px solid var(--kq-border-strong); border-right: 1px solid var(--kq-border); white-space: nowrap;
}
.kq-table tbody td { padding: 9px 14px; border-bottom: 1px solid var(--kq-border); border-right: 1px solid var(--kq-border); font-size: .82rem; color: var(--kq-text); vertical-align: middle; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kq-table thead th:last-child, .kq-table tbody td:last-child { border-right: 0; }
.kq-table tbody tr:nth-child(even) td { background: var(--kq-surface-soft); }
.kq-table tbody tr:hover td { background: var(--kq-fill); }
.kq-table tbody tr:last-child td { border-bottom: 0; }
.kq-yes { color: var(--kq-success); font-weight: 500; }
.kq-no { color: var(--kq-soft); }
.kq-muted { color: var(--kq-soft); }

/* ── Dispositivo (célula-âncora) ──────────────────────────────────────── */
.kq-dev { display: flex; align-items: center; gap: 11px; min-width: 220px; }
.kq-dev-ic { width: 34px; height: 34px; flex: 0 0 34px; border-radius: var(--kq-radius-sm); display: grid; place-items: center; background: var(--kq-accent-soft); color: var(--kq-accent); font-size: 14px; }
.kq-dev-main { min-width: 0; }
.kq-dev-name { font-size: .85rem; font-weight: 500; color: var(--kq-text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 30ch; }
.kq-dev-name:hover { color: var(--kq-accent); }
.kq-dev-sub { margin-top: 1px; font-size: 11px; color: var(--kq-soft); font-family: var(--font-mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 34ch; }
.kq-mat-chip { display: inline-flex; align-items: center; gap: 5px; margin-top: 5px; padding: 2px 8px; max-width: 100%; border-radius: 999px; font-size: 11px; font-weight: 600; color: var(--kq-accent); background: var(--kq-accent-soft); }
.kq-mat-chip i { font-size: 10px; }
.kq-mat-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ── Status / badges / pílulas ────────────────────────────────────────── */
.kq-status { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; font-weight: 600; white-space: nowrap; }
.kq-status i { font-size: 10px; }
.kq-status.on { color: var(--kq-success); }
.kq-status.off { color: var(--kq-soft); }

.kq-bat { display: inline-flex; align-items: center; gap: 5px; font-weight: 500; font-size: .8rem; font-variant-numeric: tabular-nums; }
.kq-bat i { font-size: 12px; }
.kq-bat.low { color: var(--kq-danger); }
.kq-bat.mid { color: var(--kq-warning); }
.kq-bat.ok { color: var(--kq-muted); }

.kq-net { display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--kq-muted); }
.kq-net i { color: var(--kq-soft); font-size: 12px; }

.kq-badge {
  display: inline-flex; align-items: center; gap: 5px; height: 22px; padding: 0 9px; border-radius: 999px;
  background: var(--kq-fill); color: var(--kq-muted); font-size: .68rem; font-weight: 600; white-space: nowrap;
}
.kq-badge .dot { width: 6px; height: 6px; border-radius: 99px; background: currentColor; }
.kq-badge i { font-size: 10.5px; }
.kq-badge-success { background: var(--kq-success-bg); color: var(--kq-success); }
.kq-badge-warning { background: var(--kq-warning-bg); color: var(--kq-warning); }
.kq-badge-danger  { background: var(--kq-danger-bg);  color: var(--kq-danger); }
.kq-badge-info    { background: var(--kq-accent-soft); color: var(--kq-accent); }
.kq-badge-neutral { background: var(--kq-fill); color: var(--kq-soft); }

.kq-pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 9px; border-radius: 999px; font-size: .7rem; font-weight: 600; background: var(--kq-fill); color: var(--kq-muted); }
.kq-pill::before { content: ""; width: 6px; height: 6px; border-radius: 99px; }
.kq-pill.ok { color: var(--kq-success); background: var(--kq-success-bg); }
.kq-pill.ok::before { background: var(--kq-success); }
.kq-pill.used { color: var(--kq-soft); background: var(--kq-fill); }
.kq-pill.used::before { background: var(--kq-soft); }
.kq-pill.exp { color: var(--kq-warning); background: var(--kq-warning-bg); }
.kq-pill.exp::before { background: var(--kq-warning); }
.kq-pill-warn { color: var(--kq-warning); }

.kq-linklike, .kq-devlink, .kqi-linklike { display: inline-flex; align-items: center; gap: 6px; color: var(--kq-accent); font-weight: 500; font-size: .8rem; text-decoration: none; }
.kq-linklike:hover, .kq-devlink:hover, .kqi-linklike:hover { color: var(--kq-accent-hover); text-decoration: underline; }
.kq-serial { font-family: var(--font-mono); font-size: 12px; color: var(--kq-soft); }
.kq-when { color: var(--kq-muted); }
.kq-code { font-family: var(--font-mono); font-weight: 600; letter-spacing: .05em; font-size: 13.5px; color: var(--kq-text); }
.kq-codewrap { display: inline-flex; align-items: center; gap: 8px; }

/* ── Botões de ícone (linha de tabela, copiar, editar, excluir...) ───── */
.kq-rowbtn, .kq-copy, .kq-edit, .kq-del, .kq-iconbtn, .kq-open, .kq-qr-mini {
  display: inline-grid; place-items: center; border-radius: var(--kq-radius-sm);
  border: 1px solid var(--kq-border-strong); background: var(--kq-surface); color: var(--kq-muted);
  cursor: pointer; font-size: 11px; transition: background var(--kq-transition), color var(--kq-transition), border-color var(--kq-transition);
}
.kq-rowbtn:hover, .kq-iconbtn:hover, .kq-open:hover, .kq-copy:hover, .kq-edit:hover, .kq-qr-mini:hover {
  color: var(--kq-accent); border-color: var(--kq-accent-border); background: var(--kq-accent-soft);
}
.kq-del:hover { color: var(--kq-danger); border-color: color-mix(in srgb, var(--kq-danger) 40%, transparent); background: var(--kq-danger-bg); }
.kq-copy.done { color: var(--kq-success); border-color: color-mix(in srgb, var(--kq-success) 40%, transparent); background: var(--kq-success-bg); }

/* ── Vazio ─────────────────────────────────────────────────────────────── */
.kq-empty { display: grid; place-items: center; gap: 10px; padding: 44px 16px; text-align: center; color: var(--kq-soft); font-size: .85rem; }
.kq-empty i { font-size: 24px; color: var(--kq-soft); }
.kq-empty a { color: var(--kq-accent); font-weight: 600; }

/* ── Formulário ────────────────────────────────────────────────────────── */
.kq-form { display: flex; gap: 12px; flex-wrap: wrap; align-items: flex-end; }
.kq-field { display: flex; flex-direction: column; gap: 6px; }
.kq-field label, .kq-field > label { font-size: .72rem; font-weight: 600; text-transform: uppercase; letter-spacing: .04em; color: var(--kq-soft); }
.kq-field .hint, .hint { font-size: .76rem; color: var(--kq-soft); line-height: 1.5; }
.kq-form-row { display: flex; gap: 8px; flex-wrap: wrap; align-items: stretch; }
.kq-form-row > select, .kq-form-row > input { flex: 1 1 180px; min-width: 0; }
.kq-form-row > button { flex: 0 0 auto; }

.kq-page .form-control, .kq-det .form-control, .kq-mat .form-control, .kq-cfg .form-control {
  min-height: var(--kq-control-h); border-radius: var(--kq-radius-sm); background: var(--kq-surface-soft);
  border: 1px solid var(--kq-border-strong); color: var(--kq-text); font-family: var(--kq-font); font-size: .88rem;
  transition: border-color var(--kq-transition), box-shadow var(--kq-transition), background var(--kq-transition);
}
.kq-page .form-control:focus, .kq-det .form-control:focus, .kq-mat .form-control:focus, .kq-cfg .form-control:focus {
  background: var(--kq-surface); border-color: var(--kq-accent); box-shadow: 0 0 0 3px var(--kq-accent-soft);
}

/* ── Abas (padrão detalhe — igual ficha de equipamento/licença) ──────── */
.kq-tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-bottom: 1px solid var(--kq-border); }
.kq-tabs::-webkit-scrollbar { display: none; }
.kq-tab-btn {
  flex-shrink: 0; display: inline-flex; align-items: center; gap: 7px; min-height: 40px; padding: 0 14px;
  border: 0; background: transparent; color: var(--kq-muted); font-size: .82rem; font-weight: 500; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px; white-space: nowrap;
  transition: color var(--kq-transition), border-color var(--kq-transition);
}
.kq-tab-btn i { font-size: 12px; }
.kq-tab-btn:hover { color: var(--kq-text); }
.kq-tab-btn.is-active { color: var(--kq-accent); border-bottom-color: var(--kq-accent); font-weight: 600; }
.kq-tab-count { display: inline-flex; align-items: center; justify-content: center; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 99px; background: var(--kq-fill); color: var(--kq-soft); font-size: 10px; font-weight: 700; font-variant-numeric: tabular-nums; }
.kq-tab-btn.is-active .kq-tab-count { background: var(--kq-accent-soft); color: var(--kq-accent); }
.kq-tab-dot { width: 7px; height: 7px; border-radius: 99px; background: var(--kq-warning); flex: 0 0 auto; }
.kq-tab-panel { display: none; }
.kq-tab-panel.is-active { display: grid; gap: 14px; }
.kq-tab-2col { display: grid; grid-template-columns: 1.6fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 900px) { .kq-tab-2col { grid-template-columns: 1fr; } }
.kq-col { display: grid; gap: 14px; min-width: 0; }

/* ── Modal (renomear / QR / exclusão) ─────────────────────────────────── */
.kq-modal { position: fixed; inset: 0; z-index: 1200; display: grid; place-items: center; padding: 16px; background: rgba(0,0,0,.45); backdrop-filter: blur(3px); }
.kq-modal[hidden] { display: none; }
.kq-modal-box {
  background: var(--kq-surface); border: 1px solid var(--kq-border-strong); border-radius: var(--kq-radius-lg);
  box-shadow: var(--kq-shadow-md); width: 100%; max-width: 430px; padding: 20px; display: grid; gap: 12px;
  font-family: var(--kq-font); color: var(--kq-text);
}
.kq-modal-box h3 { margin: 0; font-size: 1rem; font-weight: 700; display: flex; align-items: center; gap: 9px; color: var(--kq-text); }
.kq-modal-box h3 i { color: var(--kq-accent); }
.kq-modal-box p { margin: 0; font-size: .85rem; color: var(--kq-muted); line-height: 1.5; }
.kq-modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 4px; }

/* ── Responsivo ───────────────────────────────────────────────────────── */
@media (max-width: 960px) { .kq-metrics { grid-template-columns: repeat(3, 1fr) !important; } }
@media (max-width: 560px) { .kq-metrics { grid-template-columns: repeat(2, 1fr) !important; } }
</style>
