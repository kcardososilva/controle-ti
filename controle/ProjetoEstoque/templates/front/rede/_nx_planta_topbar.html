{% comment %}Barra superior da planta: marca, menus e escopo.{% endcomment %}
<header class="nx-top">
  <div class="nx-marca">
    <b>Planta</b><i>Rede</i>
    <small>racks · rotas · metros</small>
  </div>

  <div class="nx-grupo-btn">
    <div class="nx-menu">
      <button type="button" class="nx-btn" data-menu="menuDesenho" aria-haspopup="true" aria-expanded="false"
              title="Criar rack e rota">Desenhar</button>
      <div class="nx-menu-pop" id="menuDesenho" hidden>
        <div class="nx-menu-rot">Novo</div>
        <button type="button" class="nx-menu-item" id="mnNovaRota">Rota de cabo… (R)</button>
        <button type="button" class="nx-menu-item" id="mnNovoRack">Rack / armário… (K)</button>
      </div>
    </div>

    <div class="nx-menu">
      <button type="button" class="nx-btn" data-menu="menuSaida" aria-haspopup="true" aria-expanded="false"
              title="Levar a planta para fora da tela">Exportar</button>
      <div class="nx-menu-pop" id="menuSaida" hidden>
        <button type="button" class="nx-menu-item" id="mnExcel">Planilha Excel (6 abas)</button>
        <button type="button" class="nx-menu-item" id="mnImprimir">Imprimir / PDF da planta</button>
      </div>
    </div>

    <button type="button" class="nx-btn" id="mnBancada"
            title="O diagrama de topologia: quem liga em quem, em que porta">
      Mapa de Rede
    </button>
  </div>

  <div class="nx-sep" aria-hidden="true"></div>

  <div class="nx-top-mapa">
    <span class="nx-label">Escopo</span>
    <select class="nx-select" id="localidade" title="Recortar a planta por localidade">
      <option value="">Todas as localidades</option>
      {% for l in localidades %}
      <option value="{{ l.pk }}" {% if localidade_sel == l.pk|stringformat:'s' %}selected{% endif %}>{{ l.local }}</option>
      {% endfor %}
    </select>
    <select class="nx-select" id="area" title="Recortar por área de operação">
      <option value="">Todas as áreas</option>
      {% for valor, rotulo in areas %}
      <option value="{{ valor }}" {% if area_sel == valor %}selected{% endif %}>{{ rotulo }}</option>
      {% endfor %}
    </select>
  </div>

  <div class="nx-top-elastico"></div>

  {% if not prtg_ok %}
  <span class="nx-chip" data-tom="atencao" title="PRTG_URL / PRTG_USER / PRTG_PASSHASH não configurados no .env">
    Sem PRTG
  </span>
  {% endif %}

  <span class="nx-chip" title="O limite de 90 m vale para o lance permanente em par trançado (TIA-568). Os 10 m restantes do total de 100 m são os cordões das duas pontas.">
    Limite UTP 90 m
  </span>
</header>
