{% comment %}Barra de leitura da planta: o que está desenhado, em números monoespaçados.{% endcomment %}
<div class="nx-status" aria-live="off">
  <span><b class="nx-num" id="lerRacks">0</b> racks</span>
  <span title="Equipamentos posicionados sobre equipamentos com ficha de rede">
    equip. <b class="nx-num" id="lerEquip">0/0</b>
  </span>
  <span><b class="nx-num" id="lerRotas">0</b> rotas</span>
  <span title="Metros de cabo lançados no escopo">
    total <b class="nx-num" id="lerMetros">0 m</b>
  </span>
  <span style="color:var(--nx-fibra)" title="Metros em fibra óptica">
    fibra <b class="nx-num" id="lerFibra">0 m</b>
  </span>
  <span style="color:var(--nx-utp)" title="Metros em par trançado">
    utp <b class="nx-num" id="lerUtp">0 m</b>
  </span>
  <span><b class="nx-num" id="lerZoom">—</b></span>
  <span style="color:var(--nx-a)" id="lerSel"></span>
  <span style="color:var(--nx-a)" id="lerModo"></span>
  <div class="nx-status-elastico"></div>
  <span class="nx-status-dica">
    R desenha rota · K cria rack · Enter fecha o traçado · Backspace desfaz o ponto · Esc cancela
  </span>
</div>
