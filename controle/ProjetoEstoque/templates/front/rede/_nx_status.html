{% comment %}Barra de leitura: o que está na prancha, em números monoespaçados.{% endcomment %}
<div class="nx-status" aria-live="off">
  <span><b class="nx-num" id="lerNos">0</b> nós</span>
  <span><b class="nx-num" id="lerEnlaces">0</b> enlaces</span>
  <span title="Portas em uso sobre portas cadastradas">
    portas <b class="nx-num" id="lerPortas">0/0</b>
  </span>
  <span title="Ocupação das portas no escopo">ocup. <b class="nx-num" id="lerOcup">0%</b></span>
  <span style="color:var(--nx-st-up)" title="Online no PRTG">▲ <b class="nx-num" id="lerOnline">0</b></span>
  <span style="color:var(--nx-st-down)" title="Offline no PRTG">▼ <b class="nx-num" id="lerOffline">0</b></span>
  <span>zoom <b class="nx-num" id="lerZoom">100%</b></span>
  <span style="color:var(--nx-a)" id="lerSel"></span>
  <span style="color:var(--nx-a)" id="lerModo"></span>
  <div class="nx-status-elastico"></div>
  <span class="nx-status-dica">
    Roda aproxima · Alt/Espaço arrasta a prancha · Shift+clique soma à seleção · Ctrl+S grava versão
  </span>
  <span id="lerSalvo">—</span>
</div>
