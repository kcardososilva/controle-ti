<style>
/* ============================================================
   Preventivas — sistema de design compartilhado (fonte única).

   Antes deste arquivo, cada tela do módulo redefinia os próprios
   tokens `--pv-*` no seu <style>, com pequenas divergências entre
   elas, e três telas (agendadas, minha agenda, desempenho) usavam
   prefixos e paletas próprios. O resultado eram cores e fontes
   diferentes para o mesmo elemento em telas vizinhas.

   Regras:
     - Tokens SÓ aqui. Nenhuma tela redefine `--pv-*` no próprio style.
     - Escopo em :where(<wrappers>) — nunca :root (regra 6 do CLAUDE.md).
     - Todo token cai para um global de base.html; o literal é só o
       fallback se o global sumir.
   ============================================================ */

:where(.pv-list-page, .pv-detail-page, .pv-exec-page, .pv-start-page,
       .agd-page, .pma-page, .pv-modal) {
  --pv-primary:       var(--brand,                #0071e3);
  --pv-primary-hover: var(--brand-hover,          #0077ed);
  --pv-primary-soft:  var(--brand-soft,           rgba(0,113,227,.10));
  --pv-primary-ring:  var(--brand-ring,           rgba(0,113,227,.28));

  --pv-page:          var(--bg-page,              #f5f5f7);
  --pv-surface:       var(--bg-elevated,          #ffffff);
  --pv-muted-surface: var(--bg-fill-tertiary,     rgba(120,120,128,.08));
  --pv-hover:         var(--bg-hover,             rgba(0,0,0,.04));

  --pv-text:          var(--text-primary,         #1d1d1f);
  --pv-muted:         var(--text-tertiary,        #6e6e73);
  --pv-soft:          var(--text-quaternary,      #86868b);

  --pv-border:        var(--separator-hairline,   rgba(0,0,0,.06));
  --pv-border2:       var(--separator-non-opaque, rgba(0,0,0,.10));
  --pv-border-strong: var(--separator-strong,     rgba(0,0,0,.18));

  --pv-success:       var(--success,              #248a3d);
  --pv-success-soft:  var(--success-soft,         rgba(36,138,61,.12));
  --pv-warning:       var(--warning,              #b25000);
  --pv-warning-soft:  var(--warning-soft,         rgba(178,80,0,.12));
  --pv-danger:        var(--danger,               #d70015);
  --pv-danger-soft:   var(--danger-soft,          rgba(215,0,21,.12));
  --pv-info:          var(--info,                 #0071e3);
  --pv-info-soft:     var(--info-soft,            rgba(0,113,227,.12));

  --pv-radius-sm:     var(--radius-sm,            10px);
  --pv-radius-md:     var(--radius-md,            14px);
  --pv-radius-lg:     var(--radius-lg,            18px);
  --pv-radius-xl:     var(--radius-xl,            22px);
  --pv-radius-pill:   var(--radius-pill,          980px);

  --pv-shadow-sm:     var(--shadow-sm,            0 1px 2px rgba(0,0,0,.05));
  --pv-shadow-md:     var(--shadow-md,            0 4px 12px rgba(0,0,0,.06));
  --pv-shadow-lg:     0 12px 32px rgba(0,0,0,.14);

  --pv-transition:    var(--transition-fast,      160ms ease);
  --pv-control-h:     40px;
  --pv-font:          "Segoe UI", var(--font-display, -apple-system, sans-serif);
  --pv-mono:          var(--font-mono, ui-monospace, "SF Mono", Menlo, monospace);
}

/* Tema escuro — o módulo inteiro não tinha nenhuma regra de dark mode,
   então no tema escuro do sistema as telas continuavam com cartões brancos
   e texto quase invisível. */
body.theme-dark :where(.pv-list-page, .pv-detail-page, .pv-exec-page, .pv-start-page,
                       .agd-page, .pma-page, .pv-modal) {
  --pv-page:          #14171d;
  --pv-surface:       #1a1d24;
  --pv-muted-surface: #20242c;
  --pv-hover:         rgba(255,255,255,.06);

  --pv-text:          #f1f2f5;
  --pv-muted:         #b7bcc6;
  --pv-soft:          #8992a0;

  --pv-border:        #2a2e38;
  --pv-border2:       #333845;
  --pv-border-strong: #414857;

  --pv-primary:       #479ef5;
  --pv-primary-hover: #62abf5;
  --pv-primary-soft:  rgba(71,158,245,.16);
  --pv-primary-ring:  rgba(71,158,245,.34);

  --pv-shadow-sm:     0 1px 2px rgba(0,0,0,.4);
  --pv-shadow-md:     0 4px 12px rgba(0,0,0,.45);
  --pv-shadow-lg:     0 12px 32px rgba(0,0,0,.55);
}

/* ── Base da página ─────────────────────────────────────────────────── */
.pv-list-page, .pv-detail-page, .pv-exec-page, .pv-start-page, .agd-page, .pma-page,
.pv-list-page *, .pv-detail-page *, .pv-exec-page *, .pv-start-page *, .agd-page *, .pma-page * {
  box-sizing: border-box; min-width: 0;
}
.pv-list-page, .pv-detail-page, .pv-exec-page, .pv-start-page, .agd-page, .pma-page {
  font-family: var(--pv-font);
  color: var(--pv-text);
}

/* ── Cartão ─────────────────────────────────────────────────────────── */
.pv-card {
  background: var(--pv-surface); border: 1px solid var(--pv-border);
  border-radius: var(--pv-radius-lg); box-shadow: var(--pv-shadow-sm); overflow: hidden;
}
.pv-card-head {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 13px 18px; border-bottom: 1px solid var(--pv-border); background: var(--pv-muted-surface);
}
.pv-card-title { display: flex; align-items: center; gap: 9px; font-size: .95rem; font-weight: 700; color: var(--pv-text); margin: 0; }
.pv-card-title i { color: var(--pv-primary); font-size: 14px; }
.pv-card-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pv-card-body { padding: 16px 18px; display: grid; gap: 14px; }

/* ── Selos de estado ────────────────────────────────────────────────── */
.pv-badge {
  display: inline-flex; align-items: center; gap: 5px; padding: 3px 10px;
  border-radius: var(--pv-radius-pill); background: var(--pv-muted-surface); color: var(--pv-muted);
  font-size: .72rem; font-weight: 700; white-space: nowrap; line-height: 1.5;
}
.pv-badge i { font-size: 10px; }
.pv-badge-success { background: var(--pv-success-soft); color: var(--pv-success); }
.pv-badge-warning { background: var(--pv-warning-soft); color: var(--pv-warning); }
.pv-badge-danger  { background: var(--pv-danger-soft);  color: var(--pv-danger); }
.pv-badge-info    { background: var(--pv-info-soft);    color: var(--pv-info); }

/* ── Estado vazio ───────────────────────────────────────────────────── */
.pv-empty {
  display: grid; place-items: center; gap: 10px; padding: 40px 18px; text-align: center;
  color: var(--pv-soft); font-size: .88rem;
}
.pv-empty i { font-size: 26px; color: var(--pv-soft); opacity: .7; }
.pv-empty b { color: var(--pv-muted); font-weight: 600; }

/* ============================================================
   GALERIA DE EVIDÊNCIAS (fotos ilimitadas, antes/depois/ambos)
   ============================================================ */

/* ── Envio: área única de arrastar-e-soltar ─────────────────────────── */
.pv-dropzone {
  position: relative; display: grid; place-items: center; gap: 8px;
  padding: 26px 18px; text-align: center; cursor: pointer;
  border: 2px dashed var(--pv-border-strong); border-radius: var(--pv-radius-md);
  background: var(--pv-muted-surface); color: var(--pv-muted);
  transition: border-color var(--pv-transition), background var(--pv-transition), color var(--pv-transition);
}
.pv-dropzone:hover, .pv-dropzone:focus-visible { border-color: var(--pv-primary); color: var(--pv-primary); background: var(--pv-primary-soft); }
.pv-dropzone.is-dragging { border-color: var(--pv-primary); background: var(--pv-primary-soft); color: var(--pv-primary); border-style: solid; }
.pv-dropzone i { font-size: 26px; color: var(--pv-primary); }
.pv-dropzone-t { font-size: .92rem; font-weight: 600; color: var(--pv-text); }
.pv-dropzone-s { font-size: .78rem; color: var(--pv-soft); line-height: 1.5; }
.pv-dropzone input[type=file] { display: none; }

/* ── Grade de miniaturas ────────────────────────────────────────────── */
.pv-fotos {
  display: grid; gap: 12px;
  grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
}
.pv-foto {
  position: relative; border: 1px solid var(--pv-border2); border-radius: var(--pv-radius-md);
  overflow: hidden; background: var(--pv-surface); box-shadow: var(--pv-shadow-sm);
  transition: box-shadow var(--pv-transition), border-color var(--pv-transition);
}
.pv-foto:hover { box-shadow: var(--pv-shadow-md); border-color: var(--pv-border-strong); }
.pv-foto.is-removida { opacity: .42; }
.pv-foto.is-removida .pv-foto-img { filter: grayscale(1); }

.pv-foto-img {
  display: block; width: 100%; aspect-ratio: 4 / 3; object-fit: cover;
  background: var(--pv-muted-surface); cursor: zoom-in; border: 0;
}
/* Imagem que não carrega (arquivo ausente no servidor) não pode virar um
   ícone quebrado sem explicação — ver .pv-foto-ausente no lugar dela. */
.pv-foto-ausente {
  display: grid; place-items: center; gap: 6px; width: 100%; aspect-ratio: 4 / 3;
  background: var(--pv-muted-surface); color: var(--pv-soft); font-size: .72rem; text-align: center; padding: 8px;
}
.pv-foto-ausente i { font-size: 18px; opacity: .6; }

.pv-foto-bar { display: flex; align-items: center; gap: 6px; padding: 7px 8px; border-top: 1px solid var(--pv-border); }
.pv-foto-nome { flex: 1; min-width: 0; font-size: .7rem; color: var(--pv-soft);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Seletor Antes / Depois / Ambos — três botões, não um <select>: a marcação
   é a decisão mais repetida da tela e precisa ser de um toque só, inclusive
   no celular em campo. */
.pv-momento { display: flex; gap: 2px; padding: 3px; border-radius: var(--pv-radius-pill); background: var(--pv-muted-surface); }
.pv-momento label { flex: 1; }
.pv-momento input { position: absolute; opacity: 0; pointer-events: none; }
.pv-momento span {
  display: block; padding: 4px 2px; text-align: center; cursor: pointer;
  border-radius: var(--pv-radius-pill); font-size: .67rem; font-weight: 700; color: var(--pv-muted);
  transition: background var(--pv-transition), color var(--pv-transition);
  user-select: none; white-space: nowrap;
}
.pv-momento label:hover span { color: var(--pv-text); }
.pv-momento input:checked + span { background: var(--pv-surface); color: var(--pv-primary); box-shadow: var(--pv-shadow-sm); }
.pv-momento input:focus-visible + span { outline: 2px solid var(--pv-primary); outline-offset: 1px; }
/* "Ambos" recebe destaque próprio: é o caso que o modelo antigo não sabia
   representar, e precisa ser reconhecível de relance na grade. */
.pv-momento input[value="ambos"]:checked + span { background: var(--pv-primary); color: #fff; }

.pv-foto-x {
  position: absolute; top: 6px; right: 6px; width: 26px; height: 26px;
  display: grid; place-items: center; cursor: pointer; border: 0;
  border-radius: 50%; background: rgba(0,0,0,.58); color: #fff; font-size: 11px;
  transition: background var(--pv-transition), transform var(--pv-transition);
}
.pv-foto-x:hover { background: var(--pv-danger); transform: scale(1.08); }

/* Etiqueta do momento na visualização (ficha), onde não há seletor. */
.pv-foto-tag {
  position: absolute; top: 6px; left: 6px; padding: 2px 8px; border-radius: var(--pv-radius-pill);
  font-size: .64rem; font-weight: 800; letter-spacing: .02em; text-transform: uppercase;
  background: rgba(0,0,0,.62); color: #fff; backdrop-filter: blur(4px);
}
.pv-foto-tag.antes  { background: rgba(178,80,0,.88); }
.pv-foto-tag.depois { background: rgba(36,138,61,.88); }
.pv-foto-tag.ambos  { background: rgba(0,113,227,.90); }

/* ── Comparação antes × depois na ficha ─────────────────────────────── */
/* Cada lado ganha caixa própria: sem isso as duas grades de miniaturas se
   encostam e a comparação lê como UMA grade contínua, impossível de saber
   onde termina o "antes" e começa o "depois". */
.pv-comparacao { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 720px) { .pv-comparacao { grid-template-columns: 1fr; } }
.pv-comparacao > div {
  padding: 12px; border-radius: var(--pv-radius-md);
  background: var(--pv-muted-surface); border: 1px solid var(--pv-border);
}
/* Faixa colorida no topo de cada lado — o mesmo código de cor das etiquetas
   (âmbar = antes, verde = depois), para a leitura funcionar de relance. */
.pv-comparacao > div:first-child { box-shadow: inset 0 3px 0 var(--pv-warning); }
.pv-comparacao > div:last-child  { box-shadow: inset 0 3px 0 var(--pv-success); }
/* Numa coluna só (celular), a grade interna fica com miniaturas menores para
   não virar uma foto gigante por linha. */
.pv-comparacao .pv-fotos { grid-template-columns: repeat(auto-fill, minmax(118px, 1fr)); }

.pv-coluna-t {
  display: flex; align-items: center; gap: 7px; margin-bottom: 9px;
  font-size: .74rem; font-weight: 800; text-transform: uppercase; letter-spacing: .05em; color: var(--pv-muted);
}
.pv-coluna-t .n {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px;
  border-radius: var(--pv-radius-pill); background: var(--pv-muted-surface); color: var(--pv-soft);
  font-size: .68rem; font-weight: 800;
}
.pv-coluna-t.antes  { color: var(--pv-warning); }
.pv-coluna-t.depois { color: var(--pv-success); }

/* ── Visualizador em tela cheia (lightbox) ──────────────────────────── */
.pv-lightbox {
  position: fixed; inset: 0; z-index: 1300; display: grid; place-items: center;
  background: rgba(0,0,0,.92); padding: 20px;
}
.pv-lightbox[hidden] { display: none; }
.pv-lightbox img { max-width: 100%; max-height: calc(100vh - 128px); object-fit: contain; border-radius: var(--pv-radius-sm); }
.pv-lightbox-top {
  position: absolute; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between;
  gap: 12px; padding: 14px 18px; color: #fff; font-family: var(--pv-font); font-size: .85rem;
  background: linear-gradient(rgba(0,0,0,.6), transparent);
}
.pv-lightbox-legenda { min-width: 0; }
.pv-lightbox-legenda b { display: block; font-size: .95rem; }
.pv-lightbox-legenda small { color: rgba(255,255,255,.72); }
.pv-lightbox-btn {
  width: 38px; height: 38px; display: grid; place-items: center; flex: 0 0 auto; cursor: pointer;
  border: 0; border-radius: 50%; background: rgba(255,255,255,.14); color: #fff; font-size: 15px;
  transition: background var(--pv-transition);
}
.pv-lightbox-btn:hover { background: rgba(255,255,255,.3); }
.pv-lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); }
.pv-lightbox-nav.ant { left: 16px; }
.pv-lightbox-nav.prox { right: 16px; }
.pv-lightbox-conta {
  position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%);
  padding: 5px 14px; border-radius: var(--pv-radius-pill); background: rgba(255,255,255,.14);
  color: #fff; font-family: var(--pv-font); font-size: .78rem; font-weight: 600; font-variant-numeric: tabular-nums;
}

/* ── Nota contextual ────────────────────────────────────────────────── */
.pv-note {
  display: flex; align-items: flex-start; gap: 10px; padding: 11px 14px;
  border: 1px solid var(--pv-border2); border-left: 3px solid var(--pv-primary);
  border-radius: var(--pv-radius-sm); background: var(--pv-muted-surface);
  color: var(--pv-muted); font-size: .8rem; line-height: 1.5;
}
.pv-note i { color: var(--pv-primary); font-size: 13px; margin-top: 2px; flex: 0 0 auto; }
.pv-note.is-warn { border-left-color: var(--pv-warning); }
.pv-note.is-warn i { color: var(--pv-warning); }
</style>
