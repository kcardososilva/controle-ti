<ul class="m2m-legenda" aria-label="Legenda da fita de consultas">
  <li><i class="m2m-marca m2m-marca--legenda" data-classe="sucesso" aria-hidden="true"></i> Lida e interpretada</li>

  <li><i class="m2m-marca m2m-marca--legenda" data-classe="falha" aria-hidden="true"></i> Falha de consulta</li>
