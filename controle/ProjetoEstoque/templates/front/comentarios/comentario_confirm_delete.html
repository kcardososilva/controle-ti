{% extends 'base.html' %}
{% load static %}
{% block title %}Excluir Comentário{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/ds-cadastros.css' %}?v={{ assets_version }}">
<div class="cad-page cad-estreita cad-confirmar">
<div class="panel">
  <h2><i class="fa fa-trash"></i> Excluir Comentário</h2>
  <p>Tem certeza que deseja excluir este comentário sobre <strong>{{ obj.item.nome|default:"item sem nome" }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <div class="row">
      <button class="btn btn-danger" type="submit"><i class="fa fa-trash"></i> Confirmar</button>
      <a class="btn btn-secondary" href="{% url 'comentarios_list' %}"><i class="fa fa-arrow-left"></i> Cancelar</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
