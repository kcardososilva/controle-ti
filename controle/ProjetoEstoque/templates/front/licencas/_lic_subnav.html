{% with url_name=request.resolver_match.url_name %}
<nav class="lic-subnav">
  <a href="{% url 'licenca_list' %}"
     class="{% if url_name == 'licenca_list' or url_name == 'licenca_detail' or url_name == 'licenca_create' or url_name == 'licenca_update' %}is-active{% endif %}">
    <i class="fa fa-list-check"></i> Catálogo
  </a>
  <a href="{% url 'licenca_lote_list' %}"
     class="{% if url_name == 'licenca_lote_list' or url_name == 'licenca_lote_novo' or url_name == 'licenca_lote_edit' %}is-active{% endif %}">
    <i class="fa fa-boxes-stacked"></i> Lotes
  </a>
  <a href="{% url 'mov_licenca_list' %}"
     class="{% if url_name == 'mov_licenca_list' or url_name == 'mov_licenca_form' %}is-active{% endif %}">
    <i class="fa fa-clock-rotate-left"></i> Movimentações
  </a>
  <a href="{% url 'licencas_dashboard' %}"
     class="{% if url_name == 'licencas_dashboard' %}is-active{% endif %}">
    <i class="fa fa-chart-pie"></i> Dashboard
  </a>
</nav>
{% endwith %}
