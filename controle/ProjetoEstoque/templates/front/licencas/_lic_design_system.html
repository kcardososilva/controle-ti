.lic-field { display: flex; flex-direction: column; gap: 6px; }

.lic-label {

  text-transform: uppercase;

}

.lic-page input:not([type="hidden"]),
.lic-page select,
.lic-page textarea,
.lic-form-control {

.lic-search-wrap input { padding-left: 36px !important; }

/* ── Tabela (grade estilo planilha — Excel/Office) ───────────────────── */

.lic-table { width: 100%; min-width: 880px; border-collapse: collapse; border-top: 1px solid var(--lic-border); border-left: 1px solid var(--lic-border); }

.lic-text-right { text-align: right !important; }

.lic-nowrap { white-space: nowrap; }
.lic-muted { color: var(--lic-muted); }

.lic-title-link,

.lic-sub {

.lic-alert {

}

.lic-alert-warning { background: var(--lic-warning-bg); color: var(--lic-warning); border-color: color-mix(in srgb, var(--lic-warning) 22%, transparent); }

}
.lic-page-link:hover,
.lic-page-link.active { background: var(--lic-brand); border-color: var(--lic-brand); color: #fff; }
