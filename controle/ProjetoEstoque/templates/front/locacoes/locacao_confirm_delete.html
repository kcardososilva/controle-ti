{% extends 'base.html' %}
{% load static %}
{% block title %}Excluir Locação{% endblock %}
{% block content %}
<link rel="stylesheet" href="{% static 'css/ds-cadastros.css' %}?v={{ assets_version }}">
<div class="cad-page cad-estreita cad-confirmar">
<div class="panel">
  <h2><i class="fa fa-trash"></i> Excluir Locação</h2>
  <p>Tem certeza que deseja excluir a locação de <strong>{{ obj.equipamento.nome }}</strong>?</p>
  <form method="post">
    {% csrf_token %}
    <div class="row">
      <button class="btn btn-danger" type="submit"><i class="fa fa-trash"></i> Confirmar</button>
      <a class="btn btn-secondary" href="{% url 'locacoes_list' %}"><i class="fa fa-arrow-left"></i> Cancelar</a>
    </div>
  </form>
</div>
</div>
{% endblock %}
